spring.application.name=silentvoix-backend
server.port=${PORT:8081}

# Local development: optionally read KEY=VALUE pairs from backend-java/.env (git-ignored).
# Real environment variables take precedence over values in that file.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL on Neon. Leave SILENTVOIX_DATABASE_URL unset to run without a database.
silentvoix.database.url=${SILENTVOIX_DATABASE_URL:}
silentvoix.database.username=${SILENTVOIX_DATABASE_USERNAME:}
silentvoix.database.password=${SILENTVOIX_DATABASE_PASSWORD:}
silentvoix.database.maximum-pool-size=${SILENTVOIX_DATABASE_POOL_SIZE:5}
# Allows for a Neon compute waking up from scale-to-zero.
silentvoix.database.connection-timeout=10s
